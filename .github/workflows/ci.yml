name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Backend tests (pytest, SQLite in-memory) ────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.prod.txt

      - name: Install dependencies
        run: pip install -r requirements.prod.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -v
        env:
          # Tests override DATABASE_URL with SQLite — this value is never used
          # but must be set so Flask doesn't fall back to the default postgres URL
          DATABASE_URL: sqlite:///:memory:
          JWT_SECRET_KEY: ci-test-secret

  # ── Frontend tests (Jest) ───────────────────────────────────────────────────
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true
